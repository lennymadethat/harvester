# Harvester — paste a link, get the lessons. One Cloudflare Worker.
#
# Committed: no secrets, no account IDs. `wrangler login` supplies the account.
# Secrets (wrangler secret put NAME):
#   GEMINI_API_KEY              watches YouTube natively, reads articles and posts (aistudio.google.com)
#   ANTHROPIC_API_KEY           picks the lens and writes the synthesis
#   OPENAI_API_KEY              embeddings for the library page write (text-embedding-3-large)
#   SUPABASE_SERVICE_ROLE_KEY   your Second Brain library (pages, chunks, harvest_events)
#   HARVESTER_TOKEN             gates /harvest, /events, /unfurl, /status

name = "harvester"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
HARVESTER_VERSION = "1.0.0"
# Your Second Brain library (the key is a secret).
SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co"
# The watcher. 2.5-pro first, flash on length / quota errors. Both env-overridable.
GEMINI_MODEL = "gemini-2.5-pro"
GEMINI_FALLBACK_MODEL = "gemini-2.5-flash"
# The thinker.
ANTHROPIC_MODEL = "claude-opus-5"
# Cap on how many characters of rulebook a lens may load into the synthesis call.
METHODOLOGY_CHAR_CAP = "80000"
# Browser origins allowed to call the API (a dashboard). The token is still required.
ALLOWED_ORIGINS = "http://localhost:3000"

[observability]
enabled = true
